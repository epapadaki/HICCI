# CCC Platform: one environment with everything the platform runs.
#   web app ....... Python (FastAPI)
#   datasets ...... anndata / scanpy
#   CellPhoneDB ... Python (pip, below)
#   NATMI ......... Python (bundled in external/NATMI)
#   CellChat ...... R 4.4 + CellChat (installed from GitHub by install/install_r_packages.R)
#   SingleCellSignalR  R/Bioconductor 1.18 (conda, below)
#
# NMF 0.28 is installed from CRAN by install_r_packages.R (conda-forge only has
# 0.21.0, CellChat needs >= 0.23). The other R package versions are those of an environment in which CellChat
# 2.2.0.9001 was installed and used successfully (Linux, conda-forge/bioconda).
name: ccc-platform
channels:
  - conda-forge
  - bioconda
dependencies:
  # ---- Python
  - python=3.10
  - pip
  - numpy
  - pandas=2.3
  - scipy
  - h5py
  - anndata
  - scanpy
  - fastapi
  - uvicorn
  - jinja2
  - pydantic
  - xlsxwriter        # NATMI writes Excel summaries
  - openpyxl          # ... and reads them back
  # ---- build tools (CellChat and presto contain C++ code)
  - compilers
  - make
  - pkg-config
  - glpk
  - gsl
  - nlopt
  # ---- R
  - r-base=4.4.3
  - r-reticulate
  # SingleCellSignalR v1 (LRscore); v2 needs R >= 4.5 and has a different interface
  - bioconductor-singlecellsignalr=1.18.0
  # ICELLNET dependencies available from conda (ICELLNET itself: install/install_icellnet.R)
  - bioconductor-org.hs.eg.db
  - bioconductor-hgu133plus2.db
  - bioconductor-annotate
  - r-xml              # needed by annotate and rlist; compiling it from CRAN needs libxml2 headers
  - r-psych
  - r-ggally
  - r-gplots
  - r-readxl
  - r-ggthemes

